name: CI

on:
  push:
    branches: [ "main", "feat*/**" ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', '.gitignore', '.gitmodules', '.vscode/**', '.clang-format' ]
  pull_request:
    branches: [ "main", "feat*/**" ]
    paths-ignore: [ '**.md', '.gitignore', '.gitmodules', '.vscode/**', '.clang-format' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: windows-x64
            ccache_variant: sccache
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: linux-x64-ubuntu
            ccache_variant: ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libvulkan-dev vulkan-tools \
            vulkan-validationlayers mesa-vulkan-drivers libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y
          $vulkanDir = (Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -First 1).FullName
          if ($vulkanDir) {
            echo "VULKAN_SDK=$vulkanDir" >> $env:GITHUB_ENV
            echo "$vulkanDir\Bin" >> $env:GITHUB_PATH
          }

      - name: Sync shaderc dependencies
        shell: bash
        run: |
          cd external/shaderc
          python3 utils/git-sync-deps

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.c_compiler }}
          variant: ${{ matrix.ccache_variant }}

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core: [ 'src/**', 'include/**', 'external/**', 'CMakeLists.txt', 'Makefile', '.github/workflows/**' ]
            tests: [ 'tests/**' ]
            shaders: [ 'shaders/**' ]

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          WORKSPACE_DIR="${{ github.workspace }}"
          WORKSPACE_DIR="${WORKSPACE_DIR//\\//}"
          echo "build-output-dir=$WORKSPACE_DIR/build" >> "$GITHUB_OUTPUT"
          echo "workspace-dir=$WORKSPACE_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.ccache_variant }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.ccache_variant }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -S "${{ steps.strings.outputs.workspace-dir }}"

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config Release --parallel 2

          if [[ "${{ steps.filter.outputs.core }}" == "true" || "${{ steps.filter.outputs.tests }}" == "true" \vert{}\vert{} "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Building tests..."
            cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config Release --target tests --parallel 2
          fi

      - name: Run CTest
        if: steps.filter.outputs.core == 'true' || steps.filter.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: "${{ steps.strings.outputs.build-output-dir }}"
        shell: bash
        run: ctest --build-config Release --output-on-failure

      - name: Run Sandbox App in Headless Mode
        if: steps.filter.outputs.core == 'true' || steps.filter.outputs.shaders == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: "${{ steps.strings.outputs.build-output-dir }}/bin/sandbox --headless 10"

      - name: Prepare Release Artifacts (Linux)
        if: always() && startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          mkdir -p release/brassica-${{ matrix.artifact_name }}
          find "${{ steps.strings.outputs.build-output-dir }}/bin" -maxdepth 1 -type f -executable -exec cp {} release/brassica-${{ matrix.artifact_name }}/ \; 2>/dev/null || true
          find "${{ steps.strings.outputs.build-output-dir }}" -maxdepth 1 -type f -executable ! -name "test_*" ! -name "*.a" -exec cp {} release/brassica-${{ matrix.artifact_name }}/ \; 2>/dev/null || true
          cp -r "${{ steps.strings.outputs.workspace-dir }}/shaders" release/brassica-${{ matrix.artifact_name }}/ || true
          cp "${{ steps.strings.outputs.workspace-dir }}/README.md" release/brassica-${{ matrix.artifact_name }}/ || true
          cd release
          tar -czvf brassica-${{ matrix.artifact_name }}.tar.gz brassica-${{ matrix.artifact_name }}

      - name: Prepare Release Artifacts (Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/brassica-${{ matrix.artifact_name }}
          $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
          $releaseDir = Join-Path$buildDir "Release"
          $binDir = Join-Path$buildDir "bin"

          if (Test-Path $binDir) {
            Get-ChildItem -Path $binDir -Filter "*.exe" | Where-Object { $_.Name -notlike "test_*" } \vert{} Copy-Item -Destination "release/brassica-${{ matrix.artifact_name }}/"
          } elseif (Test-Path $releaseDir) {
            Get-ChildItem -Path $releaseDir -Filter "*.exe" | Where-Object { $_.Name -notlike "test_*" } \vert{} Copy-Item -Destination "release/brassica-${{ matrix.artifact_name }}/"
          } elseif (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Filter "*.exe" | Where-Object { $_.Name -notlike "test_*" } \vert{} Copy-Item -Destination "release/brassica-${{ matrix.artifact_name }}/"
          }

          if (Test-Path "${{ steps.strings.outputs.workspace-dir }}/shaders") {
            Copy-Item -Path "${{ steps.strings.outputs.workspace-dir }}/shaders" -Destination "release/brassica-${{ matrix.artifact_name }}/" -Recurse
          }
          Copy-Item -Path "${{ steps.strings.outputs.workspace-dir }}/README.md" -Destination "release/brassica-${{ matrix.artifact_name }}/" -ErrorAction SilentlyContinue

          Compress-Archive -Path "release/brassica-${{ matrix.artifact_name }}" -DestinationPath "release/brassica-${{ matrix.artifact_name }}.zip" -Force

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brassica-${{ matrix.artifact_name }}
          path: |
            release/*.tar.gz
            release/*.zip
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Brassica ${{ github.ref_name }}
          body: |
            ## Brassica ${{ github.ref_name }}

            ### Downloads

            | Platform | Archive |
            |----------|---------|
            | Windows (x64) | `brassica-windows-x64.zip` |
            | Linux Ubuntu (latest) (x64) | `brassica-linux-x64-ubuntu.tar.gz` |

            ### Installation

            1. Download the appropriate archive for your platform.
            2. Extract the archive to your desired location.
            3. Run the executables from the extracted directory.

            ### Requirements

            **Windows:**
            - Visual C++ Redistributable 2022 or later
            - Vulkan 1.3/1.4 Compatible Driver

            **Linux:**
            - Vulkan 1.3/1.4 Compatible Driver
            - X11 or Wayland display server

          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true